<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 36px 24px 80px;
  }

  .section-label {
    width: 980px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #444;
    margin-bottom: -28px;
  }

  /* ─── PHONE FRAME (shared) ─── */
  .phone-wrap { position: relative; }
  .phone-wrap svg { display: block; filter: drop-shadow(0 20px 32px rgba(0,0,0,0.35)); }
  .ph-side   svg { width: 180px; }
  .ph-center svg { width: 208px; }

  /* ─── BADGES (shared structure) ─── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 13px;
    border-radius: 100px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1;
  }
  .badge img {
    width: 13px;
    height: 13px;
    display: block;
    flex-shrink: 0;
  }

  /* ══════════════════════════════════════
     DESIGN A — Warm cream, playful
  ══════════════════════════════════════ */
  .banner-a {
    width: 980px;
    height: 460px;
    border-radius: 22px;
    display: flex;
    align-items: stretch;
    padding-left: 56px;
    overflow: visible;
    background:
      radial-gradient(ellipse at 28% 120%, rgba(210,150,55,0.28) 0%, transparent 48%),
      radial-gradient(ellipse at 88% -8%,  rgba(255,235,185,0.36) 0%, transparent 44%),
      linear-gradient(158deg, #fff9f0 0%, #fdf3e0 50%, #fef6e8 100%);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.72),
      0 16px 72px rgba(0,0,0,0.45);
    position: relative;
  }

  .brand-a {
    flex: 0 0 210px;
    padding-right: 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
    z-index: 2;
  }

  .wordmark-a {
    font-size: 54px;
    font-weight: 800;
    letter-spacing: -0.05em;
    color: #1a0e04;
    line-height: 1;
    /* relative so the JS-positioned chilli can use it as anchor */
    position: relative;
  }
  .wordmark-a .a-letter { color: #c0392b; }

  /* Chilli: initially hidden, JS positions it */
  #chilli-a {
    position: absolute;
    width: 16px;
    height: 16px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
  }

  .badges-a {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .badge-a {
    background: rgba(255,255,255,0.62);
    border: 1px solid rgba(150,90,25,0.15);
    color: #5a3810;
  }

  .phones-a {
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 14px;
    z-index: 2;
  }

  /* ══════════════════════════════════════
     DESIGN B — Dark slate, professional
  ══════════════════════════════════════ */
  .banner-b {
    width: 980px;
    height: 460px;
    border-radius: 22px;
    display: flex;
    align-items: stretch;
    padding-left: 56px;
    overflow: visible;
    background:
      radial-gradient(ellipse at 10% 60%, rgba(255,255,255,0.03) 0%, transparent 50%),
      linear-gradient(145deg, #1c1c1e 0%, #141414 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      0 16px 72px rgba(0,0,0,0.6);
    position: relative;
  }

  .brand-b {
    flex: 0 0 210px;
    padding-right: 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
    z-index: 2;
  }

  .wordmark-b {
    font-size: 54px;
    font-weight: 700;
    letter-spacing: -0.045em;
    color: #ffffff;
    line-height: 1;
  }
  /* Professional accent: thin red underline beneath "a" only */
  .wordmark-b .a-letter {
    position: relative;
  }
  .wordmark-b .a-letter::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0; right: 0;
    height: 3px;
    background: #c0392b;
    border-radius: 2px;
  }

  .badges-b {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .badge-b {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.75);
  }

  .phones-b {
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 14px;
    z-index: 2;
  }

  /* ── Approve row ── */
  .choose-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 0;
  }
  .choose-btn {
    background: #1a1a1a;
    border: 1.5px solid #333;
    border-radius: 10px;
    padding: 13px 28px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    color: #888;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    letter-spacing: 0.01em;
  }
  .choose-btn:hover { border-color: #555; color: #ccc; }
  .choose-btn.selected { border-color: #c0392b; color: #fff; background: #1e1010; }
</style>

<script>
// Position chilli above the "a" using exact measured coordinates
function positionChilli() {
  const letter = document.getElementById('letter-a');
  const wordmark = document.getElementById('wm-a');
  const chilli = document.getElementById('chilli-a');
  if (!letter || !chilli) return;

  const lr = letter.getBoundingClientRect();
  const wr = wordmark.getBoundingClientRect();

  const chilliW = 16, chilliH = 16;
  // Centre chilli horizontally over the "a", sit it just above the top of the letter
  const left = (lr.left - wr.left) + (lr.width / 2) - (chilliW / 2);
  const top  = (lr.top  - wr.top)  - chilliH - 2;

  chilli.style.left = left + 'px';
  chilli.style.top  = top  + 'px';
  chilli.style.opacity = '1';
}

window.addEventListener('load', positionChilli);

function pick(btn, choice) {
  document.querySelectorAll('.choose-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  // Log for server events
  if (window.__notifySelect) window.__notifySelect(choice, btn.textContent);
}
</script>
