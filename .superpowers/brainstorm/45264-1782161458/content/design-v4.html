<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 24px 60px;
  }

  .meta {
    width: 980px; margin-bottom: 14px;
    display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #444;
  }

  /* ── BANNER ── */
  .banner {
    width: 980px;
    height: 480px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    padding: 44px 48px 44px 56px;
    position: relative;
    overflow: visible;

    background:
      radial-gradient(ellipse at 35% 130%, rgba(210,155,60,0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 85% -10%, rgba(255,235,190,0.4) 0%, transparent 45%),
      linear-gradient(158deg, #fff9f0 0%, #fdf3e0 50%, #fef6e8 100%);

    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.7),
      inset 0 -1px 0 rgba(180,130,50,0.12),
      0 16px 80px rgba(0,0,0,0.5);
  }

  /* ── LEFT: compact branding ── */
  .branding {
    flex: 0 0 230px;
    padding-right: 36px;
    z-index: 2;
    align-self: center;
  }

  /* wordmark */
  .wordmark {
    font-size: 54px;
    font-weight: 800;
    letter-spacing: -0.05em;
    color: #1a0e04;
    line-height: 1;
    margin-bottom: 22px;
    display: flex;
    align-items: baseline;
    gap: 0;
  }

  .a-wrap {
    position: relative;
    color: #c0392b;
    display: inline-block;
    line-height: 1;
  }

  /* Chilli accent – large enough to read, positioned as a diacritic */
  .chilli {
    position: absolute;
    top: -20px;
    right: -14px;
    width: 24px;
    height: 24px;
    transform: rotate(32deg);
    pointer-events: none;
  }

  /* badges */
  .badges {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border-radius: 100px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(160,100,30,0.16);
    font-size: 11.5px;
    font-weight: 600;
    color: #5a3810;
    letter-spacing: 0.01em;
    width: fit-content;
  }

  /* ── RIGHT: phone cascade ── */
  .phones {
    flex: 1;
    position: relative;
    height: 100%;
    z-index: 2;
  }

  .pw {
    position: absolute;
    transform-origin: bottom center;
    filter: drop-shadow(0 28px 36px rgba(0,0,0,0.32));
  }
  .pw.left  { left: 10px;  bottom: -10px; transform: rotate(-9deg); z-index: 1; }
  .pw.mid   { left: 50%;   bottom: 6px;   transform: translateX(-50%); z-index: 3; }
  .pw.right { right: 10px; bottom: -10px; transform: rotate(9deg); z-index: 1; }

  .pw.left  svg, .pw.right svg { width: 146px; display: block; }
  .pw.mid   svg                { width: 178px; display: block; }
</style>
</head>
<body>

<div class="meta">
  <span>README header — v4 · phones as hero</span>
  <span>Approve or request tweaks in terminal</span>
</div>

<div class="banner">

  <!-- BRANDING -->
  <div class="branding">
    <div class="wordmark">
      <span>um</span>
      <span class="a-wrap">a
        <svg class="chilli" viewBox="0 0 28 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Green stem -->
          <path d="M14 10 Q18 2 26 0" stroke="#4a8040" stroke-width="2.8" stroke-linecap="round"/>
          <!-- Leaf -->
          <path d="M15.5 8 Q20 4 22 7.5 Q18.5 9 15.5 8Z" fill="#4a8040"/>
          <!-- Chilli body -->
          <path d="M14 10
            C 9 10, 4 18, 4 27
            C 4 38, 8 50, 14 49
            C 20 50, 24 38, 24 27
            C 24 18, 19 10, 14 10Z"
            fill="#c0392b"/>
          <!-- Highlight -->
          <path d="M9 16 C8 21 8 30 9.5 39"
            stroke="rgba(255,255,255,0.3)" stroke-width="2"
            stroke-linecap="round"/>
        </svg>
      </span>
      <span>mi</span>
    </div>

    <div class="badges">
      <!-- React Native -->
      <div class="badge">
        <svg width="14" height="14" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="9" fill="#61DAFB"/>
          <ellipse cx="50" cy="50" rx="45" ry="16" fill="none" stroke="#61DAFB" stroke-width="7"/>
          <ellipse cx="50" cy="50" rx="45" ry="16" fill="none" stroke="#61DAFB" stroke-width="7" transform="rotate(60 50 50)"/>
          <ellipse cx="50" cy="50" rx="45" ry="16" fill="none" stroke="#61DAFB" stroke-width="7" transform="rotate(120 50 50)"/>
        </svg>
        React Native
      </div>
      <!-- Expo -->
      <div class="badge">
        <svg width="14" height="14" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="50" fill="#000"/>
          <text x="18" y="72" font-family="Arial Black,sans-serif" font-weight="900" font-size="62" fill="white">E</text>
        </svg>
        Expo
      </div>
      <!-- TypeScript -->
      <div class="badge">
        <svg width="14" height="14" viewBox="0 0 100 100">
          <rect width="100" height="100" rx="14" fill="#3178C6"/>
          <path d="M54 54v-7H18v7h13v34h12V54z" fill="white"/>
          <path d="M72 88c2 0 4-1 6-2l2 6c-2 1-5 2-9 2-9 0-15-6-15-15s6-16 15-16c3 0 6 1 8 2l-2 6c-2-1-3-2-6-2-5 0-8 3-8 10s3 9 9 9z" fill="white"/>
        </svg>
        TypeScript
      </div>
      <!-- iOS -->
      <div class="badge">
        <svg width="14" height="14" viewBox="0 0 814 1000">
          <path d="M788 779c-25 58-55 111-96 155-56 59-103 73-152 71-38-2-72-13-108-25-38-12-72-24-110-24s-73 12-111 24c-37 12-71 24-110 25-47 2-97-13-153-72-43-46-74-100-99-160-27-63-48-143-48-220 0-84 18-162 54-225 28-51 72-94 126-120 53-26 110-39 168-40 42 1 82 12 127 26 38 12 76 24 102 24 22 0 60-12 102-24 48-15 90-26 133-25 49 1 95 12 137 35 34 18 63 44 86 76-36 22-108 77-108 180 0 108 78 166 108 184z" fill="#555"/>
          <path d="M596 0c3 44-11 89-34 124-24 36-62 65-106 70-5-43 10-88 33-122C513 36 554 7 596 0z" fill="#555"/>
        </svg>
        iOS
      </div>
    </div>
  </div>

  <!-- PHONES -->
  <div class="phones">

    <!-- Left: recipe list -->
    <div class="pw left">
      <svg viewBox="0 0 200 432" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="cl">
            <rect x="7" y="7" width="186" height="418" rx="30"/>
          </clipPath>
          <linearGradient id="gl" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
            <stop offset="45%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
        </defs>
        <!-- Buttons -->
        <rect x="-4" y="80"  width="4.5" height="26" rx="2.25" fill="#2c2c2e"/>
        <rect x="-4" y="116" width="4.5" height="34" rx="2.25" fill="#2c2c2e"/>
        <rect x="-4" y="160" width="4.5" height="34" rx="2.25" fill="#2c2c2e"/>
        <rect x="199.5" y="106" width="4.5" height="54" rx="2.25" fill="#2c2c2e"/>
        <!-- Body -->
        <rect x="0" y="0" width="200" height="432" rx="38" fill="#1c1c1e"/>
        <!-- Outer highlight -->
        <rect x="1" y="1" width="198" height="430" rx="37.5" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
        <!-- Screen bg -->
        <rect x="7" y="7" width="186" height="418" rx="30" fill="#000"/>
        <!-- Screenshot — xMidYMin keeps status bar / Dynamic Island at top -->
        <image href="/files/screen1.png" x="7" y="7" width="186" height="418"
               preserveAspectRatio="xMidYMin slice" clip-path="url(#cl)"/>
        <!-- Glare -->
        <rect x="7" y="7" width="186" height="418" rx="30"
              fill="url(#gl)" pointer-events="none"/>
      </svg>
    </div>

    <!-- Center: recipe detail (tallest) -->
    <div class="pw mid">
      <svg viewBox="0 0 200 432" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="cc">
            <rect x="7" y="7" width="186" height="418" rx="30"/>
          </clipPath>
          <linearGradient id="gc" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
            <stop offset="45%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
        </defs>
        <rect x="-4" y="80"  width="4.5" height="26" rx="2.25" fill="#2c2c2e"/>
        <rect x="-4" y="116" width="4.5" height="34" rx="2.25" fill="#2c2c2e"/>
        <rect x="-4" y="160" width="4.5" height="34" rx="2.25" fill="#2c2c2e"/>
        <rect x="199.5" y="106" width="4.5" height="54" rx="2.25" fill="#2c2c2e"/>
        <rect x="0" y="0" width="200" height="432" rx="38" fill="#1c1c1e"/>
        <rect x="1" y="1" width="198" height="430" rx="37.5" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
        <rect x="7" y="7" width="186" height="418" rx="30" fill="#000"/>
        <image href="/files/screen2.png" x="7" y="7" width="186" height="418"
               preserveAspectRatio="xMidYMin slice" clip-path="url(#cc)"/>
        <rect x="7" y="7" width="186" height="418" rx="30"
              fill="url(#gc)" pointer-events="none"/>
      </svg>
    </div>

    <!-- Right: cooking mode -->
    <div class="pw right">
      <svg viewBox="0 0 200 432" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="cr">
            <rect x="7" y="7" width="186" height="418" rx="30"/>
          </clipPath>
          <linearGradient id="gr" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
            <stop offset="45%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
        </defs>
        <rect x="-4" y="80"  width="4.5" height="26" rx="2.25" fill="#2c2c2e"/>
        <rect x="-4" y="116" width="4.5" height="34" rx="2.25" fill="#2c2c2e"/>
        <rect x="-4" y="160" width="4.5" height="34" rx="2.25" fill="#2c2c2e"/>
        <rect x="199.5" y="106" width="4.5" height="54" rx="2.25" fill="#2c2c2e"/>
        <rect x="0" y="0" width="200" height="432" rx="38" fill="#1c1c1e"/>
        <rect x="1" y="1" width="198" height="430" rx="37.5" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
        <rect x="7" y="7" width="186" height="418" rx="30" fill="#000"/>
        <image href="/files/screen3.png" x="7" y="7" width="186" height="418"
               preserveAspectRatio="xMidYMin slice" clip-path="url(#cr)"/>
        <rect x="7" y="7" width="186" height="418" rx="30"
              fill="url(#gr)" pointer-events="none"/>
      </svg>
    </div>

  </div><!-- /phones -->
</div><!-- /banner -->

<!-- Approve row -->
<div style="margin-top:24px;display:flex;gap:12px;justify-content:center;">
  <button onclick="this.style.borderColor='#c0392b';this.style.color='#fff'"
    style="background:#1e1e1e;border:1.5px solid #333;border-radius:10px;padding:12px 24px;font-size:13px;font-family:inherit;color:#aaa;cursor:pointer;">
    ✓ Looks good — generate the PNG
  </button>
  <button onclick="this.style.borderColor='#c0392b';this.style.color='#fff'"
    style="background:#1e1e1e;border:1.5px solid #333;border-radius:10px;padding:12px 24px;font-size:13px;font-family:inherit;color:#aaa;cursor:pointer;">
    ✏ Needs tweaks
  </button>
</div>

</body>
</html>
