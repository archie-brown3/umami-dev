<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 24px 80px;
  }

  .meta {
    width: 980px; margin-bottom: 14px;
    display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #444;
  }

  .banner {
    width: 980px;
    height: 460px;
    border-radius: 22px;
    display: flex;
    align-items: stretch;
    padding-left: 56px;
    position: relative;
    overflow: visible;
    background:
      radial-gradient(ellipse at 28% 115%, rgba(210,150,55,0.3)  0%, transparent 48%),
      radial-gradient(ellipse at 88%  -8%, rgba(255,235,185,0.38) 0%, transparent 44%),
      linear-gradient(158deg, #fff9f0 0%, #fdf3e0 50%, #fef6e8 100%);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.72),
      inset 0 -1px 0 rgba(180,130,50,0.1),
      0 16px 72px rgba(0,0,0,0.48);
  }

  /* ── BRANDING: vertically centred using flex ── */
  .branding {
    flex: 0 0 210px;
    padding-right: 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;  /* centres wordmark + badges in the full 460px column */
    gap: 20px;
    z-index: 2;
  }

  /* wordmark */
  .wordmark {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -0.05em;
    color: #1a0e04;
    line-height: 1;
    display: flex;
    align-items: baseline;
  }

  .a-wrap {
    position: relative;
    color: #c0392b;
    display: inline-block;
    overflow: visible;
  }

  /*
    Chilli fix:
    - NO CSS rotation (rotation was causing the body to drift right of centre)
    - centred horizontally: left 50% + translateX(-50%)
    - body in SVG is centred at cx=15 in a 30-wide viewBox
    - stem curves left via the SVG path itself for a natural look
    - sized at 22×22px so it reads clearly
  */
  .chilli-svg {
    position: absolute;
    width: 22px;
    height: 22px;
    left: 50%;
    transform: translateX(-50%);   /* no rotation */
    top: -20px;
    pointer-events: none;
  }

  /* badges */
  .badges {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /*
    Badge fix:
    - align-items: center for flex row
    - SVG uses display:inline-block + vertical-align:middle (not block)
      so it participates in baseline/centre alignment correctly
    - consistent 14×14 with square viewBoxes on all icons
  */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 100px;
    background: rgba(255,255,255,0.62);
    border: 1px solid rgba(150,90,25,0.15);
    font-size: 11.5px;
    font-weight: 600;
    color: #5a3810;
    letter-spacing: 0.01em;
    width: fit-content;
  }

  /* badge icons: inline-block + middle so they share the flex row centre */
  .badge svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    display: inline-block;
    vertical-align: middle;
    overflow: visible;
  }

  /* ── PHONES ── */
  .phones {
    flex: 1;
    display: flex;
    align-items: flex-end;   /* all phones bottom-aligned */
    justify-content: center;
    gap: 16px;
    padding-bottom: 0;
    z-index: 2;
    /* phones bottom flush with banner base */
    margin-bottom: 0;
  }

  .phones svg {
    display: block;
    filter: drop-shadow(0 22px 32px rgba(0,0,0,0.28));
  }
  .ph-side   svg { width: 184px; }
  .ph-center svg { width: 212px; }
</style>
</head>
<body>

<div class="meta">
  <span>README header — v6 · alignment fixes</span>
  <span>Approve or request tweaks in terminal</span>
</div>

<div class="banner">

  <!-- BRANDING -->
  <div class="branding">

    <div class="wordmark">
      <span>um</span><span class="a-wrap">a
        <!--
          Chilli SVG — body centred at cx=15 in 30-wide viewBox.
          Stem curves to the LEFT via the path (no CSS rotation needed).
          This keeps the body visually centred above the letter "a".
        -->
        <svg class="chilli-svg" viewBox="0 0 30 54" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- stem: from top-centre curving up-left -->
          <path d="M15 10 Q11 3 5 1" stroke="#4a8040" stroke-width="2.8" stroke-linecap="round"/>
          <!-- small leaf -->
          <path d="M13.5 8.5 Q9 4.5 6.5 8 Q10 10 13.5 8.5Z" fill="#4a8040"/>
          <!-- body: centred at cx=15 -->
          <ellipse cx="15" cy="31" rx="10" ry="17" fill="#c0392b"/>
          <!-- pointed tip -->
          <path d="M9 45 Q15 55 21 45" fill="#c0392b"/>
          <!-- highlight -->
          <path d="M10 18 C9 24 9 34 10.5 44"
                stroke="rgba(255,255,255,0.3)" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span><span>mi</span>
    </div>

    <div class="badges">

      <!-- React Native: atom, all paths, 100×100 square viewBox -->
      <div class="badge">
        <svg viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="8.5" fill="#61DAFB"/>
          <ellipse cx="50" cy="50" rx="46" ry="15" stroke="#61DAFB" stroke-width="6.5"/>
          <ellipse cx="50" cy="50" rx="46" ry="15" stroke="#61DAFB" stroke-width="6.5"
                   transform="rotate(60 50 50)"/>
          <ellipse cx="50" cy="50" rx="46" ry="15" stroke="#61DAFB" stroke-width="6.5"
                   transform="rotate(120 50 50)"/>
        </svg>
        React Native
      </div>

      <!-- Expo: E letterform as paths, 100×100 square -->
      <div class="badge">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="50" fill="#000"/>
          <!-- E as rectangles, all centred in the circle -->
          <rect x="28" y="25" width="44" height="10" rx="3" fill="white"/>
          <rect x="28" y="45" width="34" height="10" rx="3" fill="white"/>
          <rect x="28" y="65" width="44" height="10" rx="3" fill="white"/>
          <rect x="28" y="25" width="10" height="50" rx="3" fill="white"/>
        </svg>
        Expo
      </div>

      <!-- TypeScript: TS as paths, 100×100 square -->
      <div class="badge">
        <svg viewBox="0 0 100 100">
          <rect width="100" height="100" rx="14" fill="#3178C6"/>
          <!-- T: crossbar + stem -->
          <rect x="12" y="28" width="38" height="11" rx="3" fill="white"/>
          <rect x="26" y="28" width="11" height="44" rx="3" fill="white"/>
          <!-- S: top arc, middle bar, bottom arc — simplified as path -->
          <path d="M62 39 C62 32 88 32 88 44 C88 50 62 50 62 58 C62 70 88 70 88 61"
                fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
        </svg>
        TypeScript
      </div>

      <!-- iOS: clean apple silhouette, 100×100 square viewBox -->
      <div class="badge">
        <svg viewBox="0 0 100 100">
          <!-- leaf -->
          <path d="M52 14 Q64 6 62 22 Q50 26 52 14Z" fill="#555"/>
          <!-- apple body: two lobes joined, with bite -->
          <path d="M50 24
            C 40 24, 18 34, 18 55
            C 18 74, 32 90, 50 90
            C 56 90, 60 87, 65 87
            C 70 87, 74 90, 80 89
            C 70 75, 66 67, 66 55
            C 66 43, 74 33, 79 27
            C 72 23, 64 22, 58 22
            C 55 22, 52 24, 50 24Z"
            fill="#555"/>
        </svg>
        iOS
      </div>

    </div>
  </div><!-- /branding -->

  <!-- PHONES -->
  <div class="phones">

    <div class="ph-side">
      <svg viewBox="0 0 200 432" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="c1"><rect x="7" y="7" width="186" height="418" rx="30"/></clipPath>
          <linearGradient id="g1" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.17)"/>
            <stop offset="48%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
        </defs>
        <rect x="-4" y="80"  width="4" height="26" rx="2" fill="#2c2c2e"/>
        <rect x="-4" y="116" width="4" height="34" rx="2" fill="#2c2c2e"/>
        <rect x="-4" y="160" width="4" height="34" rx="2" fill="#2c2c2e"/>
        <rect x="200" y="106" width="4" height="54" rx="2" fill="#2c2c2e"/>
        <rect x="0" y="0" width="200" height="432" rx="38" fill="#1c1c1e"/>
        <rect x="1" y="1" width="198" height="430" rx="37.5" fill="none"
              stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
        <rect x="7" y="7" width="186" height="418" rx="30" fill="#000"/>
        <image href="/files/screen1.png" x="7" y="7" width="186" height="418"
               preserveAspectRatio="xMidYMin slice" clip-path="url(#c1)"/>
        <rect x="7" y="7" width="186" height="418" rx="30"
              fill="url(#g1)" pointer-events="none"/>
      </svg>
    </div>

    <div class="ph-center">
      <svg viewBox="0 0 200 432" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="c2"><rect x="7" y="7" width="186" height="418" rx="30"/></clipPath>
          <linearGradient id="g2" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.17)"/>
            <stop offset="48%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
        </defs>
        <rect x="-4" y="80"  width="4" height="26" rx="2" fill="#2c2c2e"/>
        <rect x="-4" y="116" width="4" height="34" rx="2" fill="#2c2c2e"/>
        <rect x="-4" y="160" width="4" height="34" rx="2" fill="#2c2c2e"/>
        <rect x="200" y="106" width="4" height="54" rx="2" fill="#2c2c2e"/>
        <rect x="0" y="0" width="200" height="432" rx="38" fill="#1c1c1e"/>
        <rect x="1" y="1" width="198" height="430" rx="37.5" fill="none"
              stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
        <rect x="7" y="7" width="186" height="418" rx="30" fill="#000"/>
        <image href="/files/screen2.png" x="7" y="7" width="186" height="418"
               preserveAspectRatio="xMidYMin slice" clip-path="url(#c2)"/>
        <rect x="7" y="7" width="186" height="418" rx="30"
              fill="url(#g2)" pointer-events="none"/>
      </svg>
    </div>

    <div class="ph-side">
      <svg viewBox="0 0 200 432" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="c3"><rect x="7" y="7" width="186" height="418" rx="30"/></clipPath>
          <linearGradient id="g3" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.17)"/>
            <stop offset="48%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
        </defs>
        <rect x="-4" y="80"  width="4" height="26" rx="2" fill="#2c2c2e"/>
        <rect x="-4" y="116" width="4" height="34" rx="2" fill="#2c2c2e"/>
        <rect x="-4" y="160" width="4" height="34" rx="2" fill="#2c2c2e"/>
        <rect x="200" y="106" width="4" height="54" rx="2" fill="#2c2c2e"/>
        <rect x="0" y="0" width="200" height="432" rx="38" fill="#1c1c1e"/>
        <rect x="1" y="1" width="198" height="430" rx="37.5" fill="none"
              stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
        <rect x="7" y="7" width="186" height="418" rx="30" fill="#000"/>
        <image href="/files/screen3.png" x="7" y="7" width="186" height="418"
               preserveAspectRatio="xMidYMin slice" clip-path="url(#c3)"/>
        <rect x="7" y="7" width="186" height="418" rx="30"
              fill="url(#g3)" pointer-events="none"/>
      </svg>
    </div>

  </div>
</div>

<div style="margin-top:28px;display:flex;gap:12px;justify-content:center;">
  <button onclick="this.style.borderColor='#c0392b';this.style.color='#fff'"
    style="background:#1e1e1e;border:1.5px solid #333;border-radius:10px;padding:12px 24px;font-size:13px;font-family:inherit;color:#aaa;cursor:pointer;">
    ✓ Looks good — generate the PNG
  </button>
  <button onclick="this.style.borderColor='#c0392b';this.style.color='#fff'"
    style="background:#1e1e1e;border:1.5px solid #333;border-radius:10px;padding:12px 24px;font-size:13px;font-family:inherit;color:#aaa;cursor:pointer;">
    ✏ Needs tweaks
  </button>
</div>

</body>
</html>
