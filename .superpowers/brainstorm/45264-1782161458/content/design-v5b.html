<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 24px 80px;
  }

  .meta {
    width: 980px; margin-bottom: 14px;
    display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #444;
  }

  /* ── BANNER ── */
  .banner {
    width: 980px;
    height: 460px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    /* no bottom padding — phones bleed to the bottom edge */
    padding: 48px 48px 0 56px;
    position: relative;
    /* visible so phones can overflow the bottom naturally */
    overflow: visible;

    background:
      radial-gradient(ellipse at 28% 115%, rgba(210,150,55,0.3)  0%, transparent 48%),
      radial-gradient(ellipse at 88%  -8%, rgba(255,235,185,0.38) 0%, transparent 44%),
      linear-gradient(158deg, #fff9f0 0%, #fdf3e0 50%, #fef6e8 100%);

    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.72),
      inset 0 -1px 0 rgba(180,130,50,0.1),
      0 16px 72px rgba(0,0,0,0.48);
  }

  /* rounded clip mask for the banner itself (bg only) */
  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 22px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── LEFT ── */
  .branding {
    flex: 0 0 210px;
    padding-right: 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 2;
    /* centre vertically in the visible area */
    align-self: center;
    padding-bottom: 48px; /* compensate for removed bottom padding */
  }

  .wordmark {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -0.05em;
    color: #1a0e04;
    line-height: 1;
    display: flex;
    align-items: baseline;
  }

  .a-wrap {
    position: relative;
    color: #c0392b;
    display: inline-block;
    /* overflow so chilli above isn't cut */
    overflow: visible;
  }

  .chilli-svg {
    position: absolute;
    width: 20px;
    height: 20px;
    left: 50%;
    /* shift left by half its own width to centre it over the letter */
    transform: translateX(-50%) rotate(-12deg);
    top: -19px;
    pointer-events: none;
  }

  .badges {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .badge {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border-radius: 100px;
    background: rgba(255,255,255,0.62);
    border: 1px solid rgba(150,90,25,0.15);
    font-size: 11.5px;
    font-weight: 600;
    color: #5a3810;
    letter-spacing: 0.01em;
    width: fit-content;
    line-height: 1;
  }
  .badge svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    display: block;
  }

  /* ── PHONES ── */
  .phones {
    flex: 1;
    /* align bottoms flush with the banner base */
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 16px;
    height: 100%;  /* full banner height minus top padding */
    z-index: 2;
  }

  .phones svg {
    display: block;
    filter: drop-shadow(0 24px 36px rgba(0,0,0,0.3));
  }
  /* side phones: fill ~90% of available height (460-48=412px → width = 412*(200/432) = 191px) */
  .ph-side   svg { width: 186px; }
  /* centre phone: slightly wider = slightly taller = subtle hero */
  .ph-center svg { width: 212px; }
</style>
</head>
<body>

<div class="meta">
  <span>README header — v5b · full-height phones, clean</span>
  <span>Approve or request tweaks in terminal</span>
</div>

<div class="banner">

  <!-- BRANDING -->
  <div class="branding">

          <path d="M12 11 Q15.5 4 22 1" stroke="#4a8040" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M13.5 9 Q18 5 20 8 Q16.5 10 13.5 9Z" fill="#4a8040"/>
          <ellipse cx="12" cy="30" rx="9" ry="16" fill="#c0392b"/>

          <path d="M8 16 C7 21 7 30 8.5 40" stroke="rgba(255,255,255,0.28)" stroke-width="1.8" stroke-linecap="round"/>

    </div>

      <div class="badge">

    </div>
  </div>

        <rect x="-4" y="80"  width="4" height="26" rx="2" fill="#2c2c2e"/>
        <rect x="-4" y="116" width="4" height="34" rx="2" fill="#2c2c2e"/>

        <rect x="-4" y="160" width="4" height="34" rx="2" fill="#2c2c2e"/>
        <rect x="200" y="106" width="4" height="54" rx="2" fill="#2c2c2e"/>

  </div>
</div>

<div style="margin-top:28px;display:flex;gap:12px;justify-content:center;">
  <button onclick="this.style.borderColor='#c0392b';this.style.color='#fff'"
    style="background:#1e1e1e;border:1.5px solid #333;border-radius:10px;padding:12px 24px;font-size:13px;font-family:inherit;color:#aaa;cursor:pointer;">

  <button onclick="this.style.borderColor='#c0392b';this.style.color='#fff'"

</body>
</html>
